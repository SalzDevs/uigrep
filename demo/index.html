<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uigrep demo — pricing page</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #f7f7f8; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 24px; }

    /* BUG 1: heading contrast fails (light gray on white) */
    .plan-name { color: #c8c8c8; font-size: 28px; }

    .card {
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      padding: 24px;
      margin-top: 16px;
    }
    .price { font-size: 40px; font-weight: 700; margin: 8px 0; }
    .features { list-style: none; padding: 0; margin: 0 0 20px; }
    .features li { padding: 6px 0; border-bottom: 1px solid #f0f0f1; }

    /* BUG 2: CTA is absolutely positioned and overlaps the card content */
    .cta-primary {
      position: absolute;
      top: 140px;
      left: 48%;
      padding: 12px 28px;
      background: #6d28d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    /* BUG 3: footer text cramped — line-height 0 */
    footer { text-align: center; color: #71717a; margin-top: 48px; line-height: 0.6; }
  </style>
</head>
<body>
  <main>
    <section>
      <h2 class="plan-name">Pro plan</h2>
      <div class="card">
        <div class="price">$29<span style="font-size:14px;color:#a1a1aa">/mo</span></div>
        <ul class="features">
          <li>Unlimited projects</li>
          <li>Priority support</li>
          <li>Custom domains</li>
        </ul>
        <button class="cta-primary">Start free trial</button>
      </div>
    </section>
    <footer>
      <p>uigrep demo page</p>
      <p>Three bugs planted. Load the extension, annotate, send to your agent.</p>
    </footer>
  </main>
</body>
</html>
